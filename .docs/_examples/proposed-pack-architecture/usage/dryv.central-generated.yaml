# DESIGN EXAMPLE — materialized project Usage with #/ imports.
# Runner alternatives have already been resolved to Bun.
version: dryv/v1alpha1

sources:
  authoring:
    ir: { type: ir, path: dryv.ir.yaml }

  packs:
    official:
      repository: https://github.com/dryvcode/packs
      ref: develop
      root: packs

actions:
  format:
    stage: files
    extensions: [.ts]
    commands:
      - run: [bun, x, prettier@3.9.9, --write, $(files)]

  install:
    stage: final
    dependencies:
      args:
        - dev: [--dev]
        - pinned: "$(name)@$(version)"
          any: "$(name)"
    commands:
      - run: [bun, add]

  build:
    stage: final
    commands:
      - run: [bun, run, build]

destinations:
  backend:
    path: apps/backend

    imports:
      root: src
      prefix: "#/"

    actions:
      - $ref: "#/actions/format"
      - $ref: "#/actions/install"
      - $ref: "#/actions/build"

authoring:
  source:
    $ref: "#/sources/authoring/ir"

packs:
  app:
    source:
      $ref: "#/sources/packs/official"
      path: project/backend/nestjs
    destination:
      $ref: "#/destinations/backend"
    inputs:
      package_name: dryv-backend
    bind:
      operation.server:
        $ref: "#/packs/server"

  server:
    source:
      $ref: "#/sources/packs/official"
      path: inject/backend/nestjs
    destination:
      $ref: "#/destinations/backend"
      root: [src, _generated]
    bind:
      schema.validation:
        $ref: "#/packs/validation"
      schema.persistence:
        $ref: "#/packs/persistence"
    outputs:
      controller:
        path: [controllers]
      service:
        path: [services]
      module:
        path: [modules]

  validation:
    source:
      $ref: "#/sources/packs/official"
      path: inject/validation/zod
    destination:
      $ref: "#/destinations/backend"
      root: [src, _generated]
    outputs:
      schema:
        path: [dto]

  persistence:
    source:
      $ref: "#/sources/packs/official"
      path: inject/persistence/typeorm
    destination:
      $ref: "#/destinations/backend"
      root: [src, _generated]
    inputs:
      naming_strategy: snake
    outputs:
      entity:
        path: [entities]
