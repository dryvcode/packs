# DESIGN EXAMPLE — proposed final project Usage with #/ alias imports.
version: dryv/v1alpha1

sources:
  authoring:
    ir: { type: ir, path: dryv.ir.yaml }

  packs:
    official:
      repository: https://github.com/dryvcode/packs
      ref: develop
      root: packs

destinations:
  code:
    backend:
      path: apps/backend
      choose:
        js.package_manager: bun

      imports:
        root: src
        prefix: "#/"

      outputs:
        server:
          controller:
            path: [src, _generated, controllers]
          service:
            path: [src, _generated, services]
          module:
            path: [src, _generated, modules]

        validation:
          schema:
            path: [src, _generated, dto]

        persistence:
          entity:
            path: [src, _generated, entities]

authoring:
  source: { $ref: "#/sources/authoring/ir" }

packs:
  app:
    source: { $ref: "#/sources/packs/official" }
    path: unit/backend/nestjs
    destination: { $ref: "#/destinations/code/backend" }
    inputs:
      package_name: dryv-backend
    bind:
      operation.server: { $ref: "#/packs/server" }

  server:
    source: { $ref: "#/sources/packs/official" }
    path: inject/backend/nestjs
    destination: { $ref: "#/destinations/code/backend" }
    bind:
      schema.validation: { $ref: "#/packs/validation" }
      schema.persistence: { $ref: "#/packs/persistence" }

  validation:
    source: { $ref: "#/sources/packs/official" }
    path: inject/validation/zod
    destination: { $ref: "#/destinations/code/backend" }

  persistence:
    source: { $ref: "#/sources/packs/official" }
    path: inject/persistence/typeorm
    destination: { $ref: "#/destinations/code/backend" }
    inputs:
      naming_strategy: snake
