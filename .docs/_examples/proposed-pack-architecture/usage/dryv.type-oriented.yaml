# DESIGN EXAMPLE — materialized project Usage with @/ imports and symbol overrides.
# Runner alternatives have already been resolved to pnpm.
version: dryv/v1alpha1

sources:
  authoring:
    ir: { type: ir, path: dryv.ir.yaml }

  packs:
    official:
      repository: https://github.com/dryvcode/packs
      ref: develop
      root: packs

actions:
  format:
    stage: files
    extensions: [.ts]
    commands:
      - run: [pnpm, dlx, prettier@3.9.9, --write, $(files)]

  install:
    stage: final
    dependencies:
      args:
        - dev: [-D]
        - pinned: "$(name)@$(version)"
          any: "$(name)"
    commands:
      - run: [pnpm, add]

  build:
    stage: final
    commands:
      - run: [pnpm, run, build]

destinations:
  backend:
    path: apps/backend

    imports:
      root: src
      prefix: "@/"

    actions:
      - $ref: "#/actions/format"
      - $ref: "#/actions/install"
      - $ref: "#/actions/build"

authoring:
  source:
    $ref: "#/sources/authoring/ir"

packs:
  app:
    source:
      $ref: "#/sources/packs/official"
      path: unit/backend/nestjs
    destination:
      $ref: "#/destinations/backend"
    inputs:
      package_name: "@example/backend"
    bind:
      operation.server:
        $ref: "#/packs/server"

  server:
    source:
      $ref: "#/sources/packs/official"
      path: inject/backend/nestjs
    destination:
      $ref: "#/destinations/backend"
      root: [src]
    bind:
      schema.validation:
        $ref: "#/packs/validation"
      schema.persistence:
        $ref: "#/packs/persistence"
    outputs:
      controller:
        path: [controllers]
      service:
        path: [services]
      module:
        path: [modules]

  validation:
    source:
      $ref: "#/sources/packs/official"
      path: inject/validation/zod
    destination:
      $ref: "#/destinations/backend"
      root: [src]
    outputs:
      schema:
        path: [contracts]
        symbol: "$(subject.name.pascal)Validator"

  persistence:
    source:
      $ref: "#/sources/packs/official"
      path: inject/persistence/typeorm
    destination:
      $ref: "#/destinations/backend"
      root: [src]
    inputs:
      naming_strategy: camel
    outputs:
      entity:
        path: [models]
        symbol: "$(subject.name.pascal)Model"
