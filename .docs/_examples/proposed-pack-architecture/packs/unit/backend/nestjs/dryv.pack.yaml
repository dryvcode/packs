# DESIGN EXAMPLE — proposed, not current executable syntax.
version: dryv.pack/v1alpha1
key: unit.backend.nestjs
layout: unit
source: templates

info:
  title: NestJS
  version: 0.1.0
  description: Runnable NestJS unit shell that assembles bound NestJS server feature modules.

catalog:
  purpose: backend
  summary: Runnable NestJS application unit.
  languages: [typescript]
  frameworks: [nestjs]
  tags: [backend, http, application]

target:
  languages: [typescript]
  frameworks: [nestjs]

inputs:
  package_name:
    type: string
    default: dryv-backend
    description: npm package name for the generated unit.

needs:
  operation.server:
    required: true
    match:
      languages: compatible
      frameworks: compatible
    locality: same-unit
    accepts:
      contracts: [nestjs-feature-module]

templates:
  app-module:
    imports:
      - $ref: "#/needs/operation.server"
        mode: all

  bootstrap: {}

dependencies:
  runtime:
    "@nestjs/common": ^11
    "@nestjs/core": ^11
    "@nestjs/platform-express": ^11
    reflect-metadata: ^0.2
    rxjs: ^7
  dev:
    "@types/node": ^24
    typescript: ^5.9

# No package-manager choice, placement registry or ordinary format/install
# workflow is required in the pack manifest. Those are project/setup concerns.
