# DESIGN EXAMPLE — source-neutral setup guidance for a composed NestJS unit.
version: dryv.example/v1alpha1

actions:
  format:
    stage: files
    extensions: [.ts]
    commands:
      - run: [(pnpm|yarn), dlx, prettier@3.9.9, --write, $(files)]
      - run: [npm, exec, --yes, --package, prettier@3.9.9, --, prettier, --write, $(files)]
      - run: [bun, x, prettier@3.9.9, --write, $(files)]

  install:
    stage: final
    dependencies:
      args:
        - dev:
            (pnpm|yarn): [-D]
            bun: [--dev]
            npm: [--save-dev]
        - (bun|pnpm|yarn|npm):
            pinned: "$(name)@$(version)"
            any: "$(name)"
    commands:
      - run: [(pnpm|bun|yarn), add]
      - run: [npm, install]

  build:
    stage: final
    commands:
      - run: [(pnpm|bun|yarn), run, build]
      - run: [npm, run, build]

destinations:
  backend:
    path: apps/backend

    # Suggested setup runner. Available runners are inferred from action alternatives.
    runner: bun

    imports:
      $options:
        default: relative
        relative: {}
        at-alias: { root: src, prefix: "@/" }
        hash-alias: { root: src, prefix: "#/" }

    actions:
      - $ref: "#/actions/format"
      - $ref: "#/actions/install"
      - $ref: "#/actions/build"

packs:
  app:
    pack: self
    destination:
      $ref: "#/destinations/backend"
    inputs:
      package_name: dryv-backend
    bind:
      operation.server:
        $ref: "#/packs/server"

  server:
    pack: inject/backend/nestjs
    destination:
      $ref: "#/destinations/backend"
    bind:
      schema.validation:
        $ref: "#/packs/validation"
      schema.persistence:
        $ref: "#/packs/persistence"

    outputs:
      controller:
        $options:
          default: pack-default
          pack-default: {}
          feature:
            path: [src, modules, "$(feature.name.kebab)"]
          generated:
            path: [src, _generated, controllers]
          type-oriented:
            path: [src, controllers]

      service:
        $options:
          default: pack-default
          pack-default: {}
          feature:
            path: [src, modules, "$(feature.name.kebab)"]
          generated:
            path: [src, _generated, services]
          type-oriented:
            path: [src, services]

      module:
        $options:
          default: pack-default
          pack-default: {}
          feature:
            path: [src, modules, "$(feature.name.kebab)"]
          generated:
            path: [src, _generated, modules]
          type-oriented:
            path: [src, modules]

  validation:
    pack:
      - inject/validation/zod
      - inject/validation/class-validator
    destination:
      $ref: "#/destinations/backend"

    outputs:
      schema:
        $options:
          default: pack-default
          pack-default: {}
          feature:
            path: [src, modules, "$(group.name.kebab)", dto]
          generated:
            path: [src, _generated, dto]
          type-oriented:
            path: [src, contracts]
            symbol: "$(subject.name.pascal)Validator"

  persistence:
    pack: inject/persistence/typeorm
    destination:
      $ref: "#/destinations/backend"
    inputs:
      naming_strategy: [snake, camel]

    outputs:
      entity:
        $options:
          default: pack-default
          pack-default: {}
          feature:
            path: [src, modules, "$(group.name.kebab)", entities]
          generated:
            path: [src, _generated, entities]
          type-oriented:
            path: [src, models]
            symbol: "$(subject.name.pascal)Model"
