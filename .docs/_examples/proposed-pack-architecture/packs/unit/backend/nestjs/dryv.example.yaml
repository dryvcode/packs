# DESIGN EXAMPLE — proposed, compact and source-neutral.
version: dryv.example/v1alpha1

usage:
  destinations:
    code:
      backend:
        path: apps/backend

        # Scalar list = setup choices; first item is the suggested default.
        choose:
          js.package_manager: [bun, pnpm, npm, yarn]

        # Complex alternatives use direct named values, without value: wrappers.
        imports:
          $options:
            default: relative
            relative: {}
            at-alias: { root: src, prefix: "@/" }
            hash-alias: { root: src, prefix: "#/" }

        outputs:
          $options:
            default: pack-default

            # No override: pack filesystem + pack output wins.
            pack-default: {}

            feature:
              server:
                controller:
                  path: [src, modules, "$(feature.name.kebab)"]
                service:
                  path: [src, modules, "$(feature.name.kebab)"]
                module:
                  path: [src, modules, "$(feature.name.kebab)"]

              validation:
                schema:
                  path: [src, modules, "$(group.name.kebab)", dto]

              persistence:
                entity:
                  path: [src, modules, "$(group.name.kebab)", entities]

            generated:
              server:
                controller:
                  path: [src, _generated, controllers]
                service:
                  path: [src, _generated, services]
                module:
                  path: [src, _generated, modules]

              validation:
                schema:
                  path: [src, _generated, dto]

              persistence:
                entity:
                  path: [src, _generated, entities]

            type-oriented:
              server:
                controller:
                  path: [src, controllers]
                service:
                  path: [src, services]
                module:
                  path: [src, modules]

              validation:
                schema:
                  path: [src, contracts]
                  symbol: "$(subject.name.pascal)Validator"

              persistence:
                entity:
                  path: [src, models]
                  symbol: "$(subject.name.pascal)Model"

  packs:
    app:
      pack: self
      destination: { $ref: "#/destinations/code/backend" }
      inputs:
        package_name: dryv-backend
      bind:
        operation.server: { $ref: "#/packs/server" }

    server:
      pack: inject/backend/nestjs
      destination: { $ref: "#/destinations/code/backend" }
      bind:
        schema.validation: { $ref: "#/packs/validation" }
        schema.persistence: { $ref: "#/packs/persistence" }

    validation:
      # Source-neutral pack choice. First item is suggested.
      pack:
        - inject/validation/zod
        - inject/validation/class-validator
      destination: { $ref: "#/destinations/code/backend" }

    persistence:
      pack: inject/persistence/typeorm
      destination: { $ref: "#/destinations/code/backend" }
      inputs:
        naming_strategy: [snake, camel]
