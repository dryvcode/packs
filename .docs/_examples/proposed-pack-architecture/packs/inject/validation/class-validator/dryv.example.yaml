# DESIGN EXAMPLE — source-neutral setup guidance.
version: dryv.example/v1alpha1

actions:
  format:
    stage: files
    extensions: [.ts]
    commands:
      - run: [(pnpm|yarn), dlx, prettier@3.9.9, --write, $(files)]
      - run: [npm, exec, --yes, --package, prettier@3.9.9, --, prettier, --write, $(files)]
      - run: [bun, x, prettier@3.9.9, --write, $(files)]

  install:
    stage: final
    dependencies:
      args:
        - dev:
            (pnpm|yarn): [-D]
            bun: [--dev]
            npm: [--save-dev]
        - (bun|pnpm|yarn|npm):
            pinned: "$(name)@$(version)"
            any: "$(name)"
    commands:
      - run: [(pnpm|bun|yarn), add]
      - run: [npm, install]

destinations:
  backend:
    path: apps/backend
    runner: bun
    actions:
      - $ref: "#/actions/format"
      - $ref: "#/actions/install"

packs:
  validation:
    pack: self
    destination:
      $ref: "#/destinations/backend"
      root: [src]

    # True pack default = omit destination.root and outputs entirely.
    outputs:
      schema:
        $options:

          modules:
            path: [modules, "$(group.name.kebab)", dto]

          generated:
            path: [_generated, dto]

          contracts:
            path: [contracts]
            symbol: "$(subject.name.pascal)Input"
