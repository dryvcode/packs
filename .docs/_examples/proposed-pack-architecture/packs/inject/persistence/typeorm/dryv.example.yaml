# DESIGN EXAMPLE — source-neutral proposed example contract.
version: dryv.example/v1alpha1

usage:
  destinations:
    code:
      backend:
        path: apps/backend
        place:
          persistence:
            entity:
              path: [src, modules, "$(group.name.kebab)", entities]
              filename: "$(name).entity.ts"

  packs:
    persistence:
      pack: self
      destination: { $ref: "#/destinations/code/backend" }
      inputs:
        naming_strategy:
          $example:
            title: Database naming
            default: snake
            options:
              snake:
                title: snake_case
                value: snake
              camel:
                title: camelCase
                value: camel
