# DESIGN EXAMPLE — source-neutral setup guidance.
version: dryv.example/v1alpha1

actions:
  format:
    stage: files
    extensions: [.ts]
    commands:
      - run: [(pnpm|yarn), dlx, prettier@3.9.9, --write, $(files)]
      - run: [npm, exec, --yes, --package, prettier@3.9.9, --, prettier, --write, $(files)]
      - run: [bun, x, prettier@3.9.9, --write, $(files)]

  install:
    stage: final
    dependencies:
      args:
        - dev:
            (pnpm|yarn): [-D]
            bun: [--dev]
            npm: [--save-dev]
        - (bun|pnpm|yarn|npm):
            pinned: "$(name)@$(version)"
            any: "$(name)"
    commands:
      - run: [(pnpm|bun|yarn), add]
      - run: [npm, install]

destinations:
  backend:
    path: apps/backend
    runner: bun
    actions:
      - $ref: "#/actions/format"
      - $ref: "#/actions/install"

packs:
  persistence:
    pack: self
    destination:
      $ref: "#/destinations/backend"
      root: [src]

    inputs:
      naming_strategy: [snake, camel]

    outputs:
      entity:
        $options:
          default: pack-default
          pack-default: {}

          modules:
            path: ["$(group.name.kebab)", entities]

          generated:
            path: [entities]

          models:
            path: [models]
            symbol: "$(subject.name.pascal)Model"
