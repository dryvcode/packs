# DESIGN EXAMPLE — source-neutral proposed example contract.
version: dryv.example/v1alpha1

usage:
  destinations:
    code:
      backend:
        path: apps/backend
        place:
          server:
            controller:
              path: [src, modules, "$(feature.name.kebab)"]
              filename: controller.ts
            service:
              path: [src, modules, "$(feature.name.kebab)"]
              filename: service.ts
            module:
              path: [src, modules, "$(feature.name.kebab)"]
              filename: module.ts

  packs:
    server:
      pack: self
      destination: { $ref: "#/destinations/code/backend" }
      bind:
        schema.validation: { $ref: "#/packs/validation" }
        schema.persistence: { $ref: "#/packs/persistence" }

    validation:
      $example:
        title: Validation implementation
        default: zod
        options:
          zod:
            title: Zod
            value:
              pack: inject/validation/zod
              destination: { $ref: "#/destinations/code/backend" }
          class-validator:
            title: class-validator
            value:
              pack: inject/validation/class-validator
              destination: { $ref: "#/destinations/code/backend" }

    persistence:
      pack: inject/persistence/typeorm
      destination: { $ref: "#/destinations/code/backend" }
