# DESIGN EXAMPLE — source-neutral setup guidance.
# Runner alternatives are materialized to concrete commands before normal Usage.
version: dryv.example/v1alpha1

actions:
  format:
    stage: files
    extensions: [.ts]
    commands:
      - run: [(pnpm|yarn), dlx, prettier@3.9.9, --write, $(files)]
      - run: [npm, exec, --yes, --package, prettier@3.9.9, --, prettier, --write, $(files)]
      - run: [bun, x, prettier@3.9.9, --write, $(files)]

  install:
    stage: final
    dependencies:
      args:
        - dev:
            (pnpm|yarn): [-D]
            bun: [--dev]
            npm: [--save-dev]
        - (bun|pnpm|yarn|npm):
            pinned: "$(name)@$(version)"
            any: "$(name)"
    commands:
      - run: [(pnpm|bun|yarn), add]
      - run: [npm, install]

destinations:
  backend:
    path: apps/backend
    runner: bun
    imports:
      $options:
        default: relative
        relative: {}
        alias: { root: src, prefix: "@/" }
    actions:
      - $ref: "#/actions/format"
      - $ref: "#/actions/install"

packs:
  server:
    pack: self
    destination:
      $ref: "#/destinations/backend"
      root: [src]
    bind:
      schema.validation:
        $ref: "#/packs/validation"
      schema.persistence:
        $ref: "#/packs/persistence"

    outputs:
      controller:
        $options:
          default: pack-default
          pack-default: {}
          modules:
            path: [modules, "$(feature.name.kebab)"]
          flat:
            path: [controllers]

      service:
        $options:
          default: pack-default
          pack-default: {}
          modules:
            path: [modules, "$(feature.name.kebab)"]
          flat:
            path: [services]

      module:
        $options:
          default: pack-default
          pack-default: {}
          modules:
            path: [modules, "$(feature.name.kebab)"]
          flat:
            path: [modules]

  validation:
    pack:
      - inject/validation/zod
      - inject/validation/class-validator
    destination:
      $ref: "#/destinations/backend"

  persistence:
    pack: inject/persistence/typeorm
    destination:
      $ref: "#/destinations/backend"
