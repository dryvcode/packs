version: dryv.pack/v1alpha1
key: fixture.nestjs-implementation
source: templates
info:
  title: NestJS implementation fixture
  version: 0.0.0
  description: Test-only stand-in for a project's implementation and use-case scaffolds.
plugins:
  - name: jinja
    extensions: [.j2]
selections:
  features:
    subject: operation
    filter:
      all: { facet: http }
    scope: collects.feature
  operations:
    subject: operation
    filter:
      all: { facet: http }
    scope: each
templates:
  implementation:
    $ref: '#/selections/features'
    output:
      name: $(feature.name.kebab)
      path:
        - $(group.name.kebab)
        - $(feature.name.kebab)
      symbol: $(group.name.pascal)$(feature.name.pascal)ServiceImpl
  usecase:
    $ref: '#/selections/operations'
    output:
      name: $(subject.name.kebab)
      path:
        - $(group.name.kebab)
        - $(feature.name.kebab)
      symbol: $(subject.name.pascal)UseCase
provides:
  operation.implementation:
    $ref: '#/templates/implementation'
  operation.usecase:
    $ref: '#/templates/usecase'
