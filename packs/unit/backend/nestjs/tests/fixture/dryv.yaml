version: dryv/v1alpha1
sources:
  authoring:
    main:
      type: ir
      path: dryv.ir.yaml
  packs:
    local:
      path: packs
destinations:
  app:
    path: app
    choose: { js.package_manager: bun }
    imports:
      root: src
      prefix: "@/"
  server:
    path: app
    choose: { js.package_manager: bun }
  dtos:
    path: app
    choose: { js.package_manager: bun }
authoring:
  source:
    $ref: "#/sources/authoring/main"
packs:
  app:
    source: { $ref: "#/sources/packs/local", path: unit/backend/nestjs }
    destination:
      $ref: "#/destinations/app"
    inputs:
      package_name: dryv-nestjs-fixture
    bind:
      operation.server:
        $ref: "#/packs/server"
  server:
    source: { $ref: "#/sources/packs/local", path: inject/backend/nestjs }
    destination:
      $ref: "#/destinations/server"
      root: [src]
    bind:
      schema.validation:
        $ref: "#/packs/dtos"
  dtos:
    source: { $ref: "#/sources/packs/local", path: inject/validation/class-validator }
    destination:
      $ref: "#/destinations/dtos"
      root: [src, dto]
