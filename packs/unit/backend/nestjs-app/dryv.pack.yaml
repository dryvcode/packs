version: dryv.pack/v1alpha1
key: backend.nestjs-app
layout: unit
source: templates

info:
  title: NestJS Application
  version: 0.1.0
  description: Generates an editable NestJS application shell plus generated HTTP controllers composed with bound validation and persistence packs.

catalog:
  purpose: backend
  summary: NestJS project shell with generated controllers and explicit validation/persistence bindings.
  languages: [typescript]
  frameworks: [nestjs]
  tags: [backend, http, project, nestjs]

plugins:
  - name: handlebars
    extensions: [.hbs]
  - name: jinja
    extensions: [.j2]

inputs:
  package_name:
    type: string
    default: dryv-nest-app
    description: npm package name written to package.json.

needs:
  schema.validation: { required: true }
  schema.persistence: { required: false }

selections:
  controllers:
    subject: operation
    filter:
      all: { facet: http }
    scope: collects.feature

templates:
  controller:
    $ref: "#/selections/controllers"
    output:
      name: $(feature.name.kebab)
      path:
        - $(group.name.kebab)
        - $(feature.name.kebab)
      symbols:
        controller: $(group.name.pascal)$(feature.name.pascal)Controller
        service: $(group.name.pascal)$(feature.name.pascal)Service
        module: $(group.name.pascal)$(feature.name.pascal)Module
    imports:
      - $ref: "#/needs/schema.validation"
      - $ref: "#/needs/schema.persistence"

  feature-index:
    output:
      path:
        - $(group.name.kebab)
        - $(feature.name.kebab)
    barrel: each
    exports:
      - $ref: "#/templates/controller"

  root-index:
    exports:
      - $ref: "#/templates/feature-index"

# shared:js-package-manager:start
choose:
  js.package_manager: { options: [pnpm, npm, bun, yarn] }
# shared:js-package-manager:end

dependencies:
  runtime:
    "@nestjs/common": ^11
    "@nestjs/core": ^11
    "@nestjs/platform-express": ^11
    "@nestjs/typeorm": ^11
    reflect-metadata: ^0.2
    rxjs: ^7
  dev:
    "@types/node": ^24
    prettier: "*"
    typescript: ^5.9

# shared:js-prettier-actions:start
actions:
  files:
    format:
      extensions: [.ts]
      commands:
        - run: [(pnpm|yarn), dlx, prettier@3.9.9, --write, $(files)]
        - run: [npm, exec, --yes, --package, prettier@3.9.9, --, prettier, --write, $(files)]
        - run: [bun, x, prettier@3.9.9, --write, $(files)]
  final:
    install:
      dependencies:
        args:
          - dev: { (pnpm|yarn): [-D], bun: [--dev], npm: [--save-dev] }
          - { pinned: "$(name)@$(version)", any: "$(name)" }
      commands:
        - run: [(pnpm|bun|yarn), add]
        - run: [npm, install]
# shared:js-prettier-actions:end
