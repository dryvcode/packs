version: dryv.pack/v1alpha1
key: unit.validation.haskell-validation
layout: unit
package:
  name: dryv-haskell-validation

source: templates

info:
  title: Haskell Validation
  version: 0.1.0
  description: Generates Aeson models with pure validation helpers from Dryv schemas.

  purpose: validation
  summary: Haskell Aeson models with generated pure validation functions.
  languages: [haskell]
  frameworks: [aeson]
  tags: [validation, schema, haskell]

plugins:
  - name: jinja
    extensions: [.j2]

selections:
  enums:
    subject: property.enum
    scope: each

  schemas:
    subject: schema
    scope: each

templates:
  enum:
    $ref: "#/selections/enums"
    output:
      name: $(group.name.pascal)$(subject.name.pascal)
      symbol: $(group.name.pascal)$(subject.name.pascal)

  model:
    $ref: "#/selections/schemas"
    output:
      name: $(group.name.pascal)$(subject.name.pascal)
      symbol: $(group.name.pascal)$(subject.name.pascal)
    imports:
      - $ref: "#/templates/enum"
      - $ref: "#/templates/model"

  models-index:
    exports:
      - $ref: "#/templates/model"
      - $ref: "#/templates/enum"

provides:
  schema.validation:
    $ref: "#/templates/model"
  schema.types:
    $ref: "#/templates/model"
  property.enum.types:
    $ref: "#/templates/enum"
