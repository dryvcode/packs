version: dryv.pack/v1alpha1
key: unit.clients.kotlin-client-sdk
layout: unit
package:
  name: dryv-kotlin-client

source: templates

info:
  title: Kotlin Client SDK
  version: 0.1.0
  description: Generates a Kotlin 2.4.20 Ktor Client SDK with kotlinx.serialization wire types.

  purpose: clients
  summary: Coroutine-first Ktor Client SDK with kotlinx.serialization models.
  languages: [kotlin]
  frameworks: [ktor-client, kotlinx-serialization]
  tags: [client, sdk, kotlin, http, coroutines]

plugins:
  - name: jinja
    extensions: [.j2]

inputs:
  package_name:
    type: string
    default: org.dryv.generated.client
    description: Kotlin package for generated SDK sources.

selections:
  enums:
    subject: property.enum
    scope: each

  models:
    subject: schema
    scope: each

  operations:
    subject: operation
    filter:
      all: { facet: http }
    scope: each

templates:
  enum:
    $ref: "#/selections/enums"
    output:
      name: $(group.name.pascal)$(subject.name.pascal)
      symbol: $(group.name.pascal)$(subject.name.pascal)

  model:
    $ref: "#/selections/models"
    output:
      name: $(group.name.pascal)$(subject.name.pascal)
      symbol: $(group.name.pascal)$(subject.name.pascal)
    imports:
      - $ref: "#/templates/enum"
      - $ref: "#/templates/model"

  operation:
    $ref: "#/selections/operations"
    output:
      name: $(group.name.pascal)$(subject.name.pascal)
      symbol: $(group.name.camel)$(subject.name.pascal)
    imports:
      - $ref: "#/templates/model"
      - $ref: "#/templates/enum"

provides:
  operation.client:
    $ref: "#/templates/operation"
  schema.types:
    $ref: "#/templates/model"
  property.enum.types:
    $ref: "#/templates/enum"
