version: dryv.pack/v1alpha1
key: clients.elixir-client-sdk
layout: unit
package:
  name: dryv_elixir_client

source: templates

info:
  title: Elixir Client SDK
  version: 0.1.0
  description: Generates an Elixir 1.15+ Req client SDK with structs, enum wrappers and typed operation specs.

catalog:
  purpose: clients
  summary: Req-based Elixir HTTP client SDK with generated wire structs and operations.
  languages: [elixir]
  frameworks: [req]
  tags: [client, sdk, elixir, http]

plugins:
  - name: jinja
    extensions: [.j2]

inputs:
  module_prefix:
    type: string
    default: DryvGenerated.Client
    description: Root Elixir module for generated SDK code.

selections:
  enums:
    subject: property.enum
    scope: each

  models:
    subject: schema
    scope: each

  operations:
    subject: operation
    filter:
      all: { facet: http }
    scope: each

templates:
  enum:
    $ref: "#/selections/enums"
    output:
      name: $(group.name.snake)_$(subject.name.snake)
      symbol: $(group.name.pascal)$(subject.name.pascal)

  model:
    $ref: "#/selections/models"
    output:
      name: $(group.name.snake)_$(subject.name.snake)
      symbol: $(group.name.pascal)$(subject.name.pascal)
    imports:
      - $ref: "#/templates/enum"
      - $ref: "#/templates/model"

  operation:
    $ref: "#/selections/operations"
    output:
      name: $(group.name.snake)_$(subject.name.snake)
      symbol: $(group.name.pascal)$(subject.name.pascal)
    imports:
      - $ref: "#/templates/model"
      - $ref: "#/templates/enum"

provides:
  operation.client:
    $ref: "#/templates/operation"
  schema.types:
    $ref: "#/templates/model"
  property.enum.types:
    $ref: "#/templates/enum"
