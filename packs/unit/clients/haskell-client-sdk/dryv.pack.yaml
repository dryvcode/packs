version: dryv.pack/v1alpha1
key: clients.haskell-client-sdk
layout: unit
package:
  name: dryv-haskell-client

source: templates

info:
  title: Haskell Client SDK
  version: 0.1.0
  description: Generates a typed Haskell HTTP client using http-client-tls and Aeson.

catalog:
  purpose: clients
  summary: Typed Haskell HTTP client with Aeson wire models and explicit operation functions.
  languages: [haskell]
  frameworks: [http-client, aeson]
  tags: [client, sdk, haskell, http]

plugins:
  - name: jinja
    extensions: [.j2]

selections:
  enums:
    subject: property.enum
    scope: each

  models:
    subject: schema
    scope: each

  operations:
    subject: operation
    filter:
      all: { facet: http }
    scope: each

templates:
  enum:
    $ref: "#/selections/enums"
    output:
      name: $(group.name.pascal)$(subject.name.pascal)
      symbol: $(group.name.pascal)$(subject.name.pascal)

  model:
    $ref: "#/selections/models"
    output:
      name: $(group.name.pascal)$(subject.name.pascal)
      symbol: $(group.name.pascal)$(subject.name.pascal)
    imports:
      - $ref: "#/templates/enum"
      - $ref: "#/templates/model"

  operation:
    $ref: "#/selections/operations"
    output:
      name: $(group.name.pascal)$(subject.name.pascal)
      symbol: $(group.name.camel)$(subject.name.pascal)
    imports:
      - $ref: "#/templates/model"
      - $ref: "#/templates/enum"

  models-index:
    exports:
      - $ref: "#/templates/model"
      - $ref: "#/templates/enum"

  operations-index:
    exports:
      - $ref: "#/templates/operation"

provides:
  operation.client:
    $ref: "#/templates/operation"
  schema.types:
    $ref: "#/templates/model"
  property.enum.types:
    $ref: "#/templates/enum"
