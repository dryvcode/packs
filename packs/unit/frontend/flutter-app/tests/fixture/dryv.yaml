version: dryv/v1alpha1
sources:
  authoring:
    main:
      type: ir
      path: dryv.ir.yaml
  packs:
    local:
      path: packs
destinations:
  api:
    path: out/api
  app:
    path: out/app
authoring:
  source:
    $ref: "#/sources/authoring/main"
packs:
  api:
    source: { $ref: "#/sources/packs/local", path: unit/clients/flutter-api-bridge }
    destination:
      $ref: "#/destinations/api"
  app:
    source: { $ref: "#/sources/packs/local", path: unit/frontend/flutter-app }
    destination:
      $ref: "#/destinations/app"
    bind:
      operation.client:
        $ref: "#/packs/api"
      schema.types:
        $ref: "#/packs/api"
