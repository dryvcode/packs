version: dryv.pack/v1alpha1
key: unit.frontend.react-native-app
layout: unit
source: templates

info:
  title: React Native App
  version: 0.1.0
  description: Generates an Expo React Native app from views, organised by feature with expo-router routes, TanStack Query state and calls through the ts-api-client package.
catalog:
  purpose: frontend
  summary: An Expo app from views — feature screens, expo-router routes, TanStack Query hooks, a connectivity gate, calls through ts-api-client.
  languages: [typescript]
  frameworks: [react-native, expo, expo-router, tanstack-query]
  tags: [frontend, mobile, screens, routing]

plugins:
  - name: jinja
    extensions: [.j2]

inputs:
  api_path:
    type: string
    default: ../api
    description: Path from the app to the generated ts-api-client package, used as a file dependency.

selections:
  screens:
    subject: view
    scope: each

  features:
    subject: view
    scope: collects.feature

  app_views:
    subject: view
    scope: all

templates:
  index:
    $ref: '#/selections/app_views'

  route:
    $ref: '#/selections/screens'
    output:
      name: $(subject.name.kebab)
      path:
        - $(group.name.kebab)

  routes:
    $ref: '#/selections/features'
    output:
      name: $(feature.name.kebab)
      symbol: $(feature.name.pascal)Routes

  hooks:
    $ref: '#/selections/screens'
    output:
      name: $(subject.name.kebab)
      path:
        - $(feature.name.kebab)
    imports:
      - $ref: '#/needs/operation.client'
      - $ref: '#/needs/schema.types'

  screen:
    $ref: '#/selections/screens'
    output:
      name: $(subject.name.kebab)
      path:
        - $(feature.name.kebab)
      symbol: $(subject.name.pascal)Screen

needs:
  operation.client: { required: true }
  schema.types: { required: true }

# shared:js-package-manager:start
choose:
  js.package_manager: { options: [pnpm, npm, bun, yarn] }
# shared:js-package-manager:end

actions:
  files:
    format:
      extensions: [.ts, .tsx]
      commands:
        - run: [(pnpm|yarn), exec, prettier, --write, $(files)]
        - run: [npm, exec, --, prettier, --write, $(files)]
        - run: [bun, x, prettier, --write, $(files)]
  final:
    install:
      commands:
        - run: [(pnpm|bun|yarn), install]
        - run: [npm, install]
