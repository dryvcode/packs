version: dryv.pack/v1alpha1
key: persistence.next-jdbc-models
layout: unit
package:
  name: dryv-generated-persistence

source: templates

info:
  title: next.jdbc Models
  version: 0.1.0
  description: Generates next.jdbc 1.3 table metadata and CRUD helpers for persistent Dryv schemas.

catalog:
  purpose: persistence
  summary: Clojure next.jdbc metadata and CRUD helpers for Dryv entity schemas.
  languages: [clojure]
  frameworks: [next-jdbc]
  tags: [persistence, database, sql, clojure]

plugins:
  - name: jinja
    extensions: [.j2]

selections:
  entities:
    subject: schema
    filter:
      all: { role: entity }
    scope: each

templates:
  entity:
    $ref: "#/selections/entities"
    output:
      name: $(group.name.snake)_$(subject.name.snake)
      symbol: $(group.name.snake)_$(subject.name.snake)_table

provides:
  schema.persistence:
    $ref: "#/templates/entity"
