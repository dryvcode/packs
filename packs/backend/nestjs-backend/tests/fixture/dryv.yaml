version: dryv.usage/v1alpha1

source:
  type: ir
  path: dryv.ir.yaml

packs:
  dtos:
    source: { type: local, path: packs/validation/class-validator-dtos }
    destinations:
      source: { $ref: "#/destinations/dtos" }
  entities:
    source: { type: local, path: packs/persistence/typeorm-entities }
    destinations:
      source: { $ref: "#/destinations/entities" }
  zod:
    source: { type: local, path: packs/validation/zod-schemas }
    destinations:
      source: { $ref: "#/destinations/zod" }

  # The same NestJS pack twice: once over class-validator and TypeORM, once over zod.
  server:
    source: { type: local, path: packs/backend/nestjs-backend }
    bind:
      schema.validation: { $ref: "#/packs/dtos" }
      schema.persistence: { $ref: "#/packs/entities" }
    destinations:
      source: { $ref: "#/destinations/server" }
  server-zod:
    source: { type: local, path: packs/backend/nestjs-backend }
    bind:
      schema.validation: { $ref: "#/packs/zod" }
    destinations:
      source: { $ref: "#/destinations/serverZod" }

destinations:
  dtos: { path: out/dtos }
  entities: { path: out/entities }
  zod: { path: out/zod }
  server: { path: out/server }
  serverZod: { path: out/server-zod }
