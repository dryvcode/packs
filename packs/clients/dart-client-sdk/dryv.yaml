version: dryv/v1alpha1
kind: pack

tools:
  dart:
    executable: [dart]
    validate:
      args: [--version]
      version:
        constraint: ">=3.0"
        extract: "[0-9]+\\.[0-9]+\\.[0-9]+"

commands:
  format:
    executable:
      $ref: '#/tools/dart'
    args: [format]
    cwd: project

write:
  format:
    command:
      $ref: '#/commands/format'
    extensions: [.dart]
