version: dryv.ir/v1alpha1
key: typeorm-fixture
info:
  title: TypeORM fixture
  version: '1'
  description: A small commerce model exercising relations, money, enums, indexes and invariants.

groups:
  commerce:
    description: Carts and their items.
    facets:
      storage:
        namespace: commerce

properties:
  primitives:
    commerce.Id:
      group: { $ref: '#/groups/commerce' }
      type: string
      kind: format
      format: uuid
    commerce.Title:
      group: { $ref: '#/groups/commerce' }
      type: string
      kind: text
      length: { min: 1, max: 120 }
    commerce.Quantity:
      group: { $ref: '#/groups/commerce' }
      type: number
      kind: integer
      range: { min: 1, max: 999 }
    commerce.Cents:
      group: { $ref: '#/groups/commerce' }
      type: number
      kind: integer
      format: money
      minor_units: true
      currency: KES
      description: Monetary amount in cents.
    commerce.Rate:
      group: { $ref: '#/groups/commerce' }
      type: number
      kind: decimal
      precision: 5
      scale: 2
  enums:
    commerce.CartStatus:
      group: { $ref: '#/groups/commerce' }
      values:
        active: { value: active }
        submitted: { value: submitted }
        cancelled: { value: cancelled }
  temporal:
    commerce.Timestamp:
      group: { $ref: '#/groups/commerce' }
      kind: instant
      precision: millisecond
  records:
    commerce.Metadata:
      group: { $ref: '#/groups/commerce' }
      keys: { kind: primitive, name: string }
      values: { kind: primitive, name: string }

expressions:
  commerce.QuantityPositive:
    group: { $ref: '#/groups/commerce' }
    value:
      operator: greater-than
      left: { context: value, path: [quantity] }
      right: { value: 0 }
  commerce.TotalMatches:
    group: { $ref: '#/groups/commerce' }
    value:
      operator: equal
      left: { context: value, path: [totalPrice] }
      right:
        operator: multiply
        values:
          - { context: value, path: [unitPrice] }
          - { context: value, path: [quantity] }

schemas:
  commerce.Cart:
    group: { $ref: '#/groups/commerce' }
    role: entity
    description: A customer's cart.
    fields:
      id: { kind: property, $ref: '#/properties/primitives/commerce.Id', mutation: system }
      status:
        kind: property
        $ref: '#/properties/enums/commerce.CartStatus'
        default: active
      discountRate:
        kind: property
        $ref: '#/properties/primitives/commerce.Rate'
        optional: true
      createdAt: { kind: property, $ref: '#/properties/temporal/commerce.Timestamp', mutation: system }
      items:
        kind: schema
        $ref: '#/schemas/commerce.CartItem'
        array: {}
        optional: true
        related:
          via: { $ref: '#/schemas/commerce.CartItem', field: cartId }
          cardinality: one-to-many
    facets:
      storage:
        name: carts
        primary_key: [id]
  commerce.CartItem:
    group: { $ref: '#/groups/commerce' }
    role: entity
    fields:
      id: { kind: property, $ref: '#/properties/primitives/commerce.Id', mutation: system }
      cartId:
        kind: property
        $ref: '#/properties/primitives/commerce.Id'
        relation:
          target: { $ref: '#/schemas/commerce.Cart', field: id }
          cardinality: many-to-one
          on_delete: cascade
      title: { kind: property, $ref: '#/properties/primitives/commerce.Title' }
      quantity: { kind: property, $ref: '#/properties/primitives/commerce.Quantity' }
      unitPrice: { kind: property, $ref: '#/properties/primitives/commerce.Cents' }
      totalPrice: { kind: property, $ref: '#/properties/primitives/commerce.Cents' }
      metadata:
        kind: property
        $ref: '#/properties/records/commerce.Metadata'
        nullable: true
    invariants:
      - name: quantityPositive
        rule: { $ref: '#/expressions/commerce.QuantityPositive' }
        message: Quantity must be at least 1
      - name: totalMatches
        rule: { $ref: '#/expressions/commerce.TotalMatches' }
    facets:
      storage:
        name: cart_items
        primary_key: [id]
        indexes:
          - { fields: [cartId, title], unique: true, name: cart_items_cart_title }
          - { fields: [cartId] }
