version: dryv.usage/v1alpha1

source:
  type: ir
  path: dryv.ir.yaml

packs:
  api:
    source: { type: local, path: packs/clients/flutter-api-bridge }
    destinations:
      source: { $ref: "#/destinations/api" }
  app:
    source: { type: local, path: packs/frontend/flutter-app }
    bind:
      operation.client: { $ref: "#/packs/api" }
      schema.types: { $ref: "#/packs/api" }
    destinations:
      source: { $ref: "#/destinations/app" }

destinations:
  api: { path: out/api }
  app: { path: out/app }
