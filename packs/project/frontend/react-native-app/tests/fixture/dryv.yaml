version: dryv.usage/v1alpha1
sources:
  authoring:
    main:
      type: ir
      path: dryv.ir.yaml
  packs:
    local:
      path: packs
destinations:
  code:
    api:
      path: out/api
    app:
      path: out/app
authoring:
  source:
    $ref: "#/sources/authoring/main"
packs:
  api:
    source:
      $ref: "#/sources/packs/local"
    path: package/clients/ts-api-client
    destination:
      $ref: "#/destinations/code/api"
  app:
    source:
      $ref: "#/sources/packs/local"
    path: project/frontend/react-native-app
    destination:
      $ref: "#/destinations/code/app"
    bind:
      operation.client:
        $ref: "#/packs/api"
      schema.types:
        $ref: "#/packs/api"
