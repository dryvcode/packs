version: dryv.pack/v1alpha1
key: persistence.active-record-models
layout: package
package:
  name: dryv-active-record-models

source: templates

info:
  title: Active Record Models
  version: 0.1.0
  description: Generates Active Record 8.1 model classes from persistent Dryv schemas.

catalog:
  purpose: persistence
  summary: Ruby Active Record models with typed attributes, primary keys and associations.
  languages: [ruby]
  frameworks: [active-record]
  tags: [entities, database, orm, ruby]

plugins:
  - name: jinja
    extensions: [.j2]

inputs:
  module_name:
    type: string
    default: DryvGeneratedPersistence
    description: Root Ruby module for generated persistence classes.

selections:
  entities:
    subject: schema
    filter:
      all: { role: entity }
    scope: each

  all-entities:
    subject: schema
    filter:
      all: { role: entity }
    scope: all

templates:
  entity:
    $ref: "#/selections/entities"
    output:
      name: $(group.name.snake)_$(subject.name.snake)
      symbol: $(group.name.pascal)$(subject.name.pascal)Entity
    imports:
      - $ref: "#/templates/entity"

  package-index:
    $ref: "#/selections/all-entities"
    exports:
      - $ref: "#/templates/entity"

provides:
  schema.persistence:
    $ref: "#/templates/entity"
