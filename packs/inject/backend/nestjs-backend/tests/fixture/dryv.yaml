version: dryv.usage/v1alpha1
sources:
  authoring:
    main:
      type: ir
      path: dryv.ir.yaml
  packs:
    local:
      path: packs
destinations:
  code:
    dtos:
      path: out/dtos
    entities:
      path: out/entities
    zod:
      path: out/zod
    server:
      path: out/server
    serverZod:
      path: out/server-zod
authoring:
  source:
    $ref: "#/sources/authoring/main"
packs:
  dtos:
    source:
      $ref: "#/sources/packs/local"
    path: inject/validation/class-validator-dtos
    destination:
      $ref: "#/destinations/code/dtos"
  entities:
    source:
      $ref: "#/sources/packs/local"
    path: inject/persistence/typeorm-entities
    destination:
      $ref: "#/destinations/code/entities"
  zod:
    source:
      $ref: "#/sources/packs/local"
    path: inject/validation/zod-schemas
    destination:
      $ref: "#/destinations/code/zod"
  server:
    source:
      $ref: "#/sources/packs/local"
    path: inject/backend/nestjs-backend
    destination:
      $ref: "#/destinations/code/server"
    bind:
      schema.validation:
        $ref: "#/packs/dtos"
      schema.persistence:
        $ref: "#/packs/entities"
  server-zod:
    source:
      $ref: "#/sources/packs/local"
    path: inject/backend/nestjs-backend
    destination:
      $ref: "#/destinations/code/serverZod"
    bind:
      schema.validation:
        $ref: "#/packs/zod"
