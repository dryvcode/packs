version: dryv.pack/v1alpha1
key: inject.backend.nestjs
layout: inject
source: templates

info:
  title: NestJS Backend Adapter
  version: 0.2.0
  description: Generates NestJS feature controllers, services and modules over bound validation and persistence packs.
  purpose: backend
  summary: NestJS feature controllers, services and modules for HTTP operations.
  languages: [typescript]
  frameworks: [nestjs]
  tags: [backend, rest, http, nestjs]

plugins:
  - name: handlebars
    extensions: [.hbs]
  - name: jinja
    extensions: [.j2]

needs:
  schema.validation: { required: true }
  schema.persistence: { required: false }

selections:
  features:
    subject: operation
    filter:
      all: { facet: http }
    scope: collects.feature

templates:
  feature:
    $ref: '#/selections/features'
    output:
      name: $(feature.name.kebab)
      path:
        - $(group.name.kebab)
        - $(feature.name.kebab)
      symbols:
        controller: $(group.name.pascal)$(feature.name.pascal)Controller
        service: $(group.name.pascal)$(feature.name.pascal)Service
        module: $(group.name.pascal)$(feature.name.pascal)Module
      symbol: $(group.name.pascal)$(feature.name.pascal)Module
    imports:
      - $ref: '#/needs/schema.validation'
      - $ref: '#/needs/schema.persistence'


  feature-contract:
    $ref: '#/selections/features'
    output:
      name: $(feature.name.kebab)
      path:
        - $(group.name.kebab)
        - $(feature.name.kebab)
      symbols:
        contract: $(group.name.pascal)$(feature.name.pascal)ApiContract
      symbol: $(group.name.pascal)$(feature.name.pascal)ApiContract

  feature-index:
    output:
      path:
        - $(group.name.kebab)
        - $(feature.name.kebab)
    barrel: each
    exports:
      - $ref: '#/templates/feature'
      - $ref: '#/templates/feature-contract'

  root-index:
    exports:
      - $ref: '#/templates/feature-index'

provides:
  operation.server:
    $ref: '#/templates/feature'

# shared:js-package-manager:start
choose:
  js.package_manager: { options: [pnpm, npm, bun, yarn] }
# shared:js-package-manager:end

dependencies:
  runtime:
    '@nestjs/common': ^11
    '@nestjs/core': ^11
    '@nestjs/typeorm': ^11
    codepot-openapi: ^0.0.4
    reflect-metadata: ^0.2
    rxjs: ^7
  dev:
    prettier: "*"

# shared:js-prettier-actions:start
actions:
  format:
    stage: files
    extensions: [.ts]
    commands:
      - run: [(pnpm|yarn), dlx, prettier@3.9.9, --write, $(files)]
      - run: [npm, exec, --yes, --package, prettier@3.9.9, --, prettier, --write, $(files)]
      - run: [bun, x, prettier@3.9.9, --write, $(files)]
  install:
    stage: final
    dependencies:
      args:
        - dev: { (pnpm|yarn): [-D], bun: [--dev], npm: [--save-dev] }
        - { pinned: "$(name)@$(version)", any: "$(name)" }
    commands:
      - run: [(pnpm|bun|yarn), add]
      - run: [npm, install]
# shared:js-prettier-actions:end
