version: dryv.pack/v1alpha1
key: inject.testing.schema-examples
source: templates

info:
  title: Schema Examples
  version: 0.1.0
  description: Materializes authored Dryv schema examples as deterministic JSON fixture files with a generated index.

  purpose: testing
  summary: Canonical schema examples exported as JSON fixtures for tests and tooling.
  languages: [json]
  tags: [testing, fixtures, examples, json]

plugins:
  - name: jinja
    extensions: [.j2]

selections:
  schema-examples:
    subject: schema
    scope: each

  all-schema-examples:
    subject: schema
    scope: all

templates:
  schema-examples:
    $ref: "#/selections/schema-examples"
    output:
      name: $(group.name.snake)_$(subject.name.snake)

  examples-index:
    $ref: "#/selections/all-schema-examples"
    output:
      name: index
    imports:
      - $ref: "#/templates/schema-examples"
