version: dryv.ir/v1alpha1
key: react-crud-forms-fixture

info:
  title: React CRUD Forms Fixture
  version: 1.0.0

groups:
  users:
    description: User management

properties:
  primitives:
    DisplayName:
      group: { $ref: "#/groups/users" }
      type: string
      kind: text
      length: { min: 2, max: 80 }

    Email:
      group: { $ref: "#/groups/users" }
      type: string
      kind: format
      format: email

    Age:
      group: { $ref: "#/groups/users" }
      type: number
      kind: integer
      range: { min: 18, max: 120 }

    MarketingOptIn:
      group: { $ref: "#/groups/users" }
      type: boolean

  enums:
    UserRole:
      group: { $ref: "#/groups/users" }
      values:
        member: { value: member, title: Member }
        manager: { value: manager, title: Manager }
        administrator: { value: administrator, title: Administrator }

schemas:
  CreateUserRequest:
    group: { $ref: "#/groups/users" }
    role: request
    description: Values required to create a user.
    fields:
      displayName:
        kind: property
        $ref: "#/properties/primitives/DisplayName"
      email:
        kind: property
        $ref: "#/properties/primitives/Email"
      age:
        kind: property
        $ref: "#/properties/primitives/Age"
      role:
        kind: property
        $ref: "#/properties/enums/UserRole"
      marketingOptIn:
        kind: property
        $ref: "#/properties/primitives/MarketingOptIn"
        optional: true

  UpdateUserRequest:
    group: { $ref: "#/groups/users" }
    role: request
    description: Editable values for an existing user.
    fields:
      displayName:
        kind: property
        $ref: "#/properties/primitives/DisplayName"
        optional: true
      email:
        kind: property
        $ref: "#/properties/primitives/Email"
        optional: true
      age:
        kind: property
        $ref: "#/properties/primitives/Age"
        optional: true
      role:
        kind: property
        $ref: "#/properties/enums/UserRole"
        optional: true
      marketingOptIn:
        kind: property
        $ref: "#/properties/primitives/MarketingOptIn"
        optional: true

operations:
  CreateUser:
    group: { $ref: "#/groups/users" }
    role: create
    description: Create a user.
    facets:
      http:
        method: POST
        path: /users
        inputs:
          - port:
              $ref: "#/operations/CreateUser"
              direction: input
            source:
              kind: body
              representation: { kind: json, media_type: application/json }
    input:
      schema: { $ref: "#/schemas/CreateUserRequest" }

  UpdateUser:
    group: { $ref: "#/groups/users" }
    role: update
    description: Update a user.
    facets:
      http:
        method: PATCH
        path: /users
        inputs:
          - port:
              $ref: "#/operations/UpdateUser"
              direction: input
            source:
              kind: body
              representation: { kind: json, media_type: application/json }
    input:
      schema: { $ref: "#/schemas/UpdateUserRequest" }

  GetUser:
    group: { $ref: "#/groups/users" }
    role: detail
    description: This operation must not produce a form.
    facets:
      http:
        method: GET
        path: /users/detail
