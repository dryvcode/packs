version: dryv/v1alpha1

sources:
  authoring:
    ir: { type: ir, path: dryv.ir.yaml }
  packs:
    local: { path: packs }

destinations:
  app: { path: out }

authoring:
  source: { $ref: "#/sources/authoring/ir" }

packs:
  client:
    source: { $ref: "#/sources/packs/local", path: unit/clients/ts-api-client }
    destination: { $ref: "#/destinations/app" }
    inputs:
      package_name: react-crud-forms-fixture

  forms:
    source: { $ref: "#/sources/packs/local", path: inject/frontend/react-crud-forms }
    destination: { $ref: "#/destinations/app" }
    bind:
      schema.types: { $ref: "#/packs/client" }
      operation.client: { $ref: "#/packs/client" }
