version: dryv.pack/v1alpha1
key: persistence.typeorm-entities
source: templates

info:
  title: TypeORM Entities
  version: 0.1.0
  description: Generates TypeORM entities with typed columns, indexes, checks and relations from entity-role schemas.
catalog:
  purpose: persistence
  summary: TypeORM entities with typed columns, relations, checks and indexes.
  languages: [typescript]
  frameworks: [typeorm]
  tags: [entities, database, orm]

plugins:
  - name: jinja
    extensions: [.j2]

inputs:
  naming_strategy:
    type: string
    default: snake
    description: Column naming, `snake` (cart_id) or `camel` (cartId).

selections:
  enums:
    subject: property.enum
    scope: each

  # Persisted schemas: the entity role.
  entities:
    subject: schema
    filter:
      all: { role: entity }
    scope: each

templates:
  enum:
    $ref: '#/selections/enums'
    output:
      name: $(subject.name.kebab)
      symbol: $(subject.name.pascal)

  entity:
    $ref: '#/selections/entities'
    output:
      name: $(subject.name.kebab)
      path:
        - $(group.name.kebab)
      symbol: $(subject.name.pascal)Entity
    imports:
      - $ref: '#/templates/enum'
      - $ref: '#/templates/entity'

  index:
    exports:
      - $ref: '#/templates/entity'
      - $ref: '#/templates/enum'

provides:
  schema.persistence:
    $ref: '#/templates/entity'
  property.enum.types:
    $ref: '#/templates/enum'

# shared:js-package-manager:start
choose:
  js.package_manager: { options: [pnpm, npm, bun, yarn] }
# shared:js-package-manager:end

# Libraries the generated code imports, and the formatter its format action runs.
dependencies:
  runtime:
    reflect-metadata: ^0.2
    typeorm: ^0.3
  dev:
    prettier: "*"

# shared:js-prettier-actions:start
actions:
  files:
    format:
      extensions: [.ts]
      commands:
        - run: [(pnpm|yarn), dlx, prettier@3.9.9, --write, $(files)]
        - run: [npm, exec, --yes, --package, prettier@3.9.9, --, prettier, --write, $(files)]
        - run: [bun, x, prettier@3.9.9, --write, $(files)]
  final:
    install:
      dependencies:
        args:
          - dev: { (pnpm|yarn): [-D], bun: [--dev], npm: [--save-dev] }
          - { pinned: "$(name)@$(version)", any: "$(name)" }
      commands:
        - run: [(pnpm|bun|yarn), add]
        - run: [npm, install]
# shared:js-prettier-actions:end
