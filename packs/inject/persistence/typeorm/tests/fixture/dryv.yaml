version: dryv/v1alpha1
sources:
  authoring:
    main:
      type: ir
      path: dryv.ir.yaml
  packs:
    local:
      path: packs
destinations:
  out:
    path: out
    imports: { path: out, prefix: "#/" }
    choose: { js.package_manager: bun }
authoring:
  source:
    $ref: "#/sources/authoring/main"
packs:
  types:
    source: { $ref: "#/sources/packs/local", path: inject/types/typescript }
    destination:
      $ref: "#/destinations/out"
      root: [types]
  entities:
    destinations:
      test: { $ref: "#/destinations/out", root: [test] }
    source: { $ref: "#/sources/packs/local", path: inject/persistence/typeorm }
    destination:
      $ref: "#/destinations/out"
    bind:
      property.enum.types: { $ref: "#/packs/types" }
      property.types: { $ref: "#/packs/types" }
applications:
  commerce:
    authoring: { $ref: "#/sources/authoring/main" }
    application: { $ref: "#/applications/Commerce" }
    packs:
      - { $ref: "#/packs/types" }
      - { $ref: "#/packs/entities" }
build:
  selection:
    apps: [commerce]
