version: dryv/v1alpha1
sources:
  authoring:
    main:
      type: ir
      path: dryv.ir.yaml
  packs:
    local:
      path: packs
destinations:
  out:
    path: out
authoring:
  source:
    $ref: "#/sources/authoring/main"
packs:
  types:
    source: { $ref: "#/sources/packs/local", path: inject/types/typescript }
    destination:
      $ref: "#/destinations/out"
