version: dryv.pack/v1alpha1
key: inject.validation.joi
source: templates

info:
  title: Joi schemas
  version: 0.1.0
  description: Generates a Joi schema for every schema and enum.
  purpose: validation
  summary: Joi schemas with field limits, formats and invariants.
  languages: [typescript]
  frameworks: [joi]
  tags: [schemas, validation]

plugins:
  - name: jinja
    extensions: [.j2]

selections:
  enums:
    subject: property.enum
    scope: each

  schemas:
    subject: schema
    scope: each

templates:
  enum:
    $ref: '#/selections/enums'
    output:
      name: $(subject.name.kebab)
      symbol: $(subject.name.pascal)Schema

  schema:
    $ref: '#/selections/schemas'
    output:
      name: $(subject.name.kebab)
      path:
        - $(group.name.kebab)
      symbol: $(subject.name.pascal)Schema
    imports:
      - $ref: '#/templates/enum'
      - $ref: '#/templates/schema'

  index:
    exports:
      - $ref: '#/templates/schema'
      - $ref: '#/templates/enum'

# Joi has no type inference, so this pack provides validation only.
provides:
  schema.validation:
    $ref: '#/templates/schema'

# shared:js-package-manager:start
choose:
  js.package_manager: { options: [pnpm, npm, bun, yarn] }
# shared:js-package-manager:end

# Libraries the generated code imports, and the formatter its format action runs.
dependencies:
  runtime:
    joi: ^17
  dev:
    prettier: "*"

# shared:js-prettier-actions:start
actions:
  format:
    stage: files
    extensions: [.ts]
    commands:
      - run: [(pnpm|yarn), dlx, prettier@3.9.9, --write, $(files)]
      - run: [npm, exec, --yes, --package, prettier@3.9.9, --, prettier, --write, $(files)]
      - run: [bun, x, prettier@3.9.9, --write, $(files)]
  install:
    stage: final
    dependencies:
      args:
        - dev: { (pnpm|yarn): [-D], bun: [--dev], npm: [--save-dev] }
        - { pinned: "$(name)@$(version)", any: "$(name)" }
    commands:
      - run: [(pnpm|bun|yarn), add]
      - run: [npm, install]
# shared:js-prettier-actions:end
