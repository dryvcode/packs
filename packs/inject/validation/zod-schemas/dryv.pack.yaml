version: dryv.pack/v1alpha1
key: validation.zod-schemas
source: templates

info:
  title: Zod schemas
  version: 0.1.0
  description: Generates a zod schema and its inferred type for every schema and enum.
catalog:
  purpose: validation
  summary: zod schemas with field limits, formats and invariants.
  languages: [typescript]
  frameworks: [zod]
  tags: [schemas, validation]

plugins:
  - name: jinja
    extensions: [.j2]

selections:
  enums:
    subject: property.enum
    scope: each

  schemas:
    subject: schema
    scope: each

templates:
  enum:
    $ref: '#/selections/enums'
    output:
      name: $(subject.name.kebab)
      symbol: $(subject.name.pascal)Schema

  schema:
    $ref: '#/selections/schemas'
    output:
      name: $(subject.name.kebab)
      path:
        - $(group.name.kebab)
      symbol: $(subject.name.pascal)Schema
    imports:
      - $ref: '#/templates/enum'
      - $ref: '#/templates/schema'

  index:
    exports:
      - $ref: '#/templates/schema'
      - $ref: '#/templates/enum'

# The slot symbol is the zod schema. Its type is `z.infer<typeof XSchema>`, also exported,
# but a slot carries one symbol, so this pack doesn't claim `schema.types`.
provides:
  schema.validation:
    $ref: '#/templates/schema'
