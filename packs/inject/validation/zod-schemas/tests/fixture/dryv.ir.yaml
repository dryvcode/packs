version: dryv.ir/v1alpha1
key: validation-fixture
info:
  title: Validation fixture
  version: '1'
  description: A registration request exercising formats, lengths, ranges, arrays, nesting, enums and invariants.

groups:
  accounts:
    description: Sign-up and profiles.

properties:
  primitives:
    accounts.Name:
      group: { $ref: '#/groups/accounts' }
      type: string
      kind: text
      length: { min: 1, max: 60 }
    accounts.Email:
      group: { $ref: '#/groups/accounts' }
      type: string
      kind: format
      format: email
    accounts.Phone:
      group: { $ref: '#/groups/accounts' }
      type: string
      kind: format
      format: phone
    accounts.Url:
      group: { $ref: '#/groups/accounts' }
      type: string
      kind: format
      format: url
    accounts.Password:
      group: { $ref: '#/groups/accounts' }
      type: string
      kind: text
      length: { min: 8, max: 50 }
    accounts.Age:
      group: { $ref: '#/groups/accounts' }
      type: number
      kind: integer
      range: { min: 18, max: 120 }
    accounts.Tag:
      group: { $ref: '#/groups/accounts' }
      type: string
      kind: text
      length: { min: 2, max: 20 }
    accounts.PostalCode:
      group: { $ref: '#/groups/accounts' }
      type: string
      kind: text
      pattern: { match: ['^[0-9]{5}$'] }
    accounts.Id:
      group: { $ref: '#/groups/accounts' }
      type: string
      kind: format
      format: uuid
  enums:
    accounts.Role:
      group: { $ref: '#/groups/accounts' }
      values:
        member: { value: member }
        admin: { value: admin }
  temporal:
    accounts.BirthDate:
      group: { $ref: '#/groups/accounts' }
      kind: date

expressions:
  accounts.PasswordsMatch:
    group: { $ref: '#/groups/accounts' }
    value:
      operator: equal
      left: { context: value, path: [confirmPassword] }
      right: { context: value, path: [password] }

schemas:
  accounts.Address:
    group: { $ref: '#/groups/accounts' }
    role: value
    fields:
      city: { kind: property, $ref: '#/properties/primitives/accounts.Name' }
      postalCode: { kind: property, $ref: '#/properties/primitives/accounts.PostalCode' }
  accounts.RegisterRequest:
    group: { $ref: '#/groups/accounts' }
    role: request
    description: Everything a new member submits.
    fields:
      firstName: { kind: property, $ref: '#/properties/primitives/accounts.Name' }
      lastName: { kind: property, $ref: '#/properties/primitives/accounts.Name' }
      email: { kind: property, $ref: '#/properties/primitives/accounts.Email' }
      phone: { kind: property, $ref: '#/properties/primitives/accounts.Phone', optional: true }
      avatar: { kind: property, $ref: '#/properties/primitives/accounts.Url', optional: true }
      password: { kind: property, $ref: '#/properties/primitives/accounts.Password' }
      confirmPassword: { kind: property, $ref: '#/properties/primitives/accounts.Password' }
      age: { kind: property, $ref: '#/properties/primitives/accounts.Age' }
      role: { kind: property, $ref: '#/properties/enums/accounts.Role', default: member }
      birthDate: { kind: property, $ref: '#/properties/temporal/accounts.BirthDate', optional: true }
      tags:
        kind: property
        $ref: '#/properties/primitives/accounts.Tag'
        array: { min: 1, max: 5 }
      address: { kind: schema, $ref: '#/schemas/accounts.Address' }
    invariants:
      - name: passwordsMatch
        rule: { $ref: '#/expressions/accounts.PasswordsMatch' }
        message: Passwords must match
  accounts.Member:
    group: { $ref: '#/groups/accounts' }
    role: entity
    fields:
      id: { kind: property, $ref: '#/properties/primitives/accounts.Id', mutation: system }
      email: { kind: property, $ref: '#/properties/primitives/accounts.Email' }
    facets:
      storage: { name: members, primary_key: [id] }
